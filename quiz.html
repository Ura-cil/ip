<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InterviewX - Practice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Interview<span>X</span></div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">Progress</a>
        </div>
    </nav>


    <main class="quiz-container">

        <div class="quiz-header">

            <span id="categoryName">HTML</span>

            <span id="questionNumber">
                Question 1 / 5
            </span>

            <span id="timer">30s</span>

        </div>


        <div class="progress-bar">
            <div id="progress"></div>
        </div>


        <div class="question-box">

            <h2 id="question">
                What does HTML stand for?
            </h2>

            <div id="options">

                <button class="option">Hyper Text Markup Language</button>

                <button class="option">High Text Machine Language</button>

                <button class="option">Hyperlinks Text Mark Language</button>

                <button class="option">Home Tool Markup Language</button>

            </div>

        </div>


        <button id="nextBtn">Next Question →</button>

    </main>


    <script src="questions.js"></script>
    <script src="script.js"></script>

</body>
</html>
